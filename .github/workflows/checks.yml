name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build
        run: ./scripts/build-app.sh

      - name: Run checks
        run: |
          failed=0
          for test_script in scripts/test-*.sh; do
            echo "::group::$test_script"
            status=0
            "$test_script" || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::$test_script failed with exit code $status"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
